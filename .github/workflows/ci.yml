name: Validacao web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências do lockfile
        run: npm ci
      - name: Conferir TypeScript
        run: npm run typecheck
      - name: Executar testes
        run: npm run test
      - name: Exportar aplicação web
        run: npm run build:web
      - name: Auditar segurança e exceções aprovadas
        run: npm run audit:security

  validar_postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconstruir banco, testar isolamento e ensaiar restauração
        run: npm run test:postgres
